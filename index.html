<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARKET - نظام إدارة المرتجعات</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 5px solid #831843;
        }
        h1 {
            text-align: center;
            color: #831843;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background-color: #f8fafc;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #831843;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(131, 24, 67, 0.1);
        }
        .calc-btn, .admin-btn {
            width: 100%;
            background-color: #831843;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .calc-btn:hover, .admin-btn:hover { background-color: #500724; }
        .admin-btn { background-color: #334155; font-size: 14px; }
        .admin-btn:hover { background-color: #1e293b; }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #f1f5f9;
            display: none;
            text-align: center;
        }
        .result-box.show { display: block; }
        .days-left {
            font-size: 16px;
            color: #475569;
            margin-bottom: 8px;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 6px;
        }
        .status-accepted { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-rejected { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .status-warning { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background-color: #fff;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            left: 15px; top: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }
        .section-title {
            margin: 15px 0 8px 0;
            font-size: 15px;
            color: #334155;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 4px;
        }
        .list-box {
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 6px;
            background: #f8fafc;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }
        .list-item:last-child { border-bottom: none; }
        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- شاشة تسجيل دخول المناديب -->
<div id="authScreen" class="modal" style="display: flex;">
    <div class="modal-content" style="text-align: center; max-width: 400px;">
        <h2 style="color: #831843; margin-top:0;">تسجيل دخول المناديب</h2>
        <p style="font-size: 13px; color: #64748b;">الرجاء إدخال الـ HR ID الخاص بك للمتابعة</p>
        <input type="text" id="loginHrInput" placeholder="أدخل HR ID هنا" style="text-align: center; margin-bottom: 15px;">
        <button class="calc-btn" onclick="verifyLogin()">دخول</button>
        <div id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 10px;"></div>
    </div>
</div>

<div class="container" id="mainApp" style="opacity: 0.3; pointer-events: none;">
    <h1>MARKET - آلة حاسبة مرتجعات</h1>
    <div class="subtitle" id="userWelcome">أدخل بيانات المنتج للحساب</div>

    <div class="form-group">
        <label for="productType">نوع المنتج:</label>
        <select id="productType">
            <option value="normal">منتج عادي</option>
            <option value="popcorn">فشار</option>
        </select>
    </div>

    <div class="form-group">
        <label>طريقة إدخال الصلاحية:</label>
        <select id="inputType" onchange="toggleInputMode()">
            <option value="dates">تاريخ إنتاج وتاريخ انتهاء</option>
            <option value="duration">مدة الصلاحية (بدون تاريخ إنتاج)</option>
        </select>
    </div>

    <!-- وضع التواريخ -->
    <div id="datesMode">
        <div class="form-group">
            <label for="prodDate">تاريخ الإنتاج:</label>
            <input type="date" id="prodDate">
        </div>
        <div class="form-group">
            <label for="expiryDate">تاريخ الانتهاء:</label>
            <input type="date" id="expiryDate">
        </div>
    </div>

    <!-- وضع المدة -->
    <div id="durationMode" style="display: none;">
        <div class="form-group">
            <label for="itemExpiryDate">تاريخ الانتهاء للمنتج:</label>
            <input type="date" id="itemExpiryDate">
        </div>
    </div>

    <button class="calc-btn" onclick="calculateReturn()">احسب النتيجة وتسجيل العملية</button>
    <button class="admin-btn" onclick="openAdminModal()">لوحة تحكم الآدمن (السجلات وإدارة الـ HR IDs)</button>

    <div id="resultBox" class="result-box">
        <div class="days-left" id="daysLeftText"></div>
        <div id="statusBadgeContainer"></div>
    </div>
</div>

<!-- لوحة تحكم الآدمن -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAdminModal()">&times;</span>
        <h2 style="color: #334155; font-size: 18px; margin-top:0;">لوحة تحكم الآدمن</h2>
        
        <!-- قسم تغيير كلمة المرور للآدمن (يلغي القديمة فوراً) -->
        <div class="section-title">تغيير كلمة مرور الآدمن</div>
        <div class="form-group" style="margin-bottom: 8px;">
            <input type="password" id="newAdminPass" placeholder="كلمة المرور الجديدة للآدمن">
        </div>
        <button class="calc-btn" style="background-color: #334155; margin-top:0; margin-bottom: 10px;" onclick="changeAdminPassword()">حفظ كلمة المرور الجديدة</button>

        <div class="section-title">سجل عمليات الحساب</div>
        <div class="list-box" id="logsContainer"></div>

        <div class="section-title" style="margin-top: 20px;">إدارة الـ HR IDs المصرح لها بالدخول</div>
        <div class="form-group" style="margin-bottom: 8px;">
            <input type="text" id="newHrId" placeholder="أدخل HR ID جديد (مثل HR1002)" style="margin-bottom: 8px;">
            <input type="text" id="newHrName" placeholder="اختياري: اسم المندوب أو صاحب الـ ID">
        </div>
        <button class="calc-btn" style="background-color: #334155; margin-top:0; margin-bottom: 10px;" onclick="addAllowedHr()">إضافة للسماح بالدخول</button>

        <div class="list-box" id="hrListContainer"></div>
    </div>
</div>

<script>
    let currentHrId = '';
    // تخزين الـ HRs ككائنات تحتوي على id و name
    let allowedUsers = JSON.parse(localStorage.getItem('allowedUsers')) || [
        {id: 'ADMIN', name: 'الآدمن الرئيسي'},
        {id: '12345', name: 'مندوب تجريبي'},
        {id: 'HR001', name: ''}
    ];
    let adminPass = localStorage.getItem('adminPass') || 'ADMIN';
    let returnLogs = JSON.parse(localStorage.getItem('returnLogs')) || [];

    function verifyLogin() {
        const inputId = document.getElementById('loginHrInput').value.trim();
        const errorDiv = document.getElementById('loginError');
        
        if (!inputId) {
            errorDiv.innerText = 'الرجاء إدخال الـ HR ID';
            return;
        }

        const foundUser = allowedUsers.find(user => user.id === inputId);

        if (foundUser) {
            currentHrId = foundUser.name ? `${foundUser.id} (${foundUser.name})` : foundUser.id;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.opacity = '1';
            document.getElementById('mainApp').style.pointerEvents = 'auto';
            document.getElementById('userWelcome').innerText = `مرحباً بك (HR ID: ${currentHrId})`;
            errorDiv.innerText = '';
        } else {
            errorDiv.innerText = 'عذراً، هذا الـ HR ID غير مصرح له بالدخول أو محظور.';
        }
    }

    function openAdminModal() {
        const pass = prompt("أدخل كلمة مرور الآدمن الحالية:");
        if (pass === adminPass) {
            document.getElementById('adminModal').style.display = 'flex';
            renderAdminData();
        } else {
            alert('كلمة المرور غير صحيحة');
        }
    }

    function closeAdminModal() {
        document.getElementById('adminModal').style.display = 'none';
    }

    function changeAdminPassword() {
        const newPass = document.getElementById('newAdminPass').value.trim();
        if (newPass) {
            adminPass = newPass;
            localStorage.setItem('adminPass', adminPass);
            document.getElementById('newAdminPass').value = '';
            alert('تم تغيير كلمة المرور بنجاح وإلغاء القديمة تماماً');
        } else {
            alert('الرجاء إدخال كلمة مرور صحيحة');
        }
    }

    function addAllowedHr() {
        const newId = document.getElementById('newHrId').value.trim();
        const newName = document.getElementById('newHrName').value.trim();

        if (!newId) {
            alert('الرجاء إدخال الـ HR ID');
            return;
        }

        const exists = allowedUsers.some(user => user.id === newId);
        if (exists) {
            alert('هذا الـ HR ID موجود مسبقاً');
            return;
        }

        allowedUsers.push({ id: newId, name: newName });
        localStorage.setItem('allowedUsers', JSON.stringify(allowedUsers));
        
        document.getElementById('newHrId').value = '';
        document.getElementById('newHrName').value = '';
        renderAdminData();
        alert('تمت الإضافة بنجاح');
    }

    function removeHr(id) {
        allowedUsers = allowedUsers.filter(user => user.id !== id);
        localStorage.setItem('allowedUsers', JSON.stringify(allowedUsers));
        renderAdminData();
    }

    function renderAdminData() {
        const hrContainer = document.getElementById('hrListContainer');
        hrContainer.innerHTML = '';
        allowedUsers.forEach(user => {
            const displayName = user.name ? `${user.id} — ${user.name}` : user.id;
            hrContainer.innerHTML += `
                <div class="list-item">
                    <span>${displayName}</span>
                    <span class="delete-btn" onclick="removeHr('${user.id}')">حظر / حذف</span>
                </div>
            `;
        });

        const logsContainer = document.getElementById('logsContainer');
        logsContainer.innerHTML = '';
        if (returnLogs.length === 0) {
            logsContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; padding:10px;">لا توجد عمليات مسجلة حتى الآن</div>';
            return;
        }

        returnLogs.slice().reverse().forEach(log => {
            logsContainer.innerHTML += `
                <div class="list-item" style="flex-direction: column; align-items: flex-start; gap: 2px;">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <strong>HR ID: ${log.hrId}</strong>
                        <span style="font-size: 11px; color: #64748b;">${log.time}</span>
                    </div>
                    <div style="font-size: 12px; color: #334155;">المنتج: ${log.product} | الأيام: ${log.days} يوم</div>
                    <div style="font-size: 12px; font-weight: bold; color: ${log.color};">النتيجة: ${log.result}</div>
                </div>
            `;
        });
    }

    function toggleInputMode() {
        const mode = document.getElementById('inputType').value;
        if (mode === 'dates') {
            document.getElementById('datesMode').style.display = 'block';
            document.getElementById('durationMode').style.display = 'none';
        } else {
            document.getElementById('datesMode').style.display = 'none';
            document.getElementById('durationMode').style.display = 'block';
            document.getElementById('itemExpiryDate').valueAsDate = new Date();
        }
    }

    document.getElementById('expiryDate').valueAsDate = new Date();
    document.getElementById('prodDate').valueAsDate = new Date();
    document.getElementById('itemExpiryDate').valueAsDate = new Date();

    function calculateReturn() {
        const productType = document.getElementById('productType').value;
        const inputType = document.getElementById('inputType').value;
        let diffDays = 0;

        const today = new Date();
        today.setHours(0,0,0,0);

        if (inputType === 'dates') {
            const expiryInput = document.getElementById('expiryDate').value;
            if (!expiryInput) {
                alert('الرجاء إدخال تاريخ الانتهاء');
                return;
            }
            const expiryDate = new Date(expiryInput);
            expiryDate.setHours(0,0,0,0);
            const diffTime = expiryDate - today;
            diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        } else {
            const expiryInput = document.getElementById('itemExpiryDate').value;
            if (!expiryInput) {
                alert('الرجاء إدخال تاريخ الانتهاء للمنتج');
                return;
            }
            const expiryDate = new Date(expiryInput);
            expiryDate.setHours(0,0,0,0);
            const diffTime = expiryDate - today;
            diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        const resultBox = document.getElementById('resultBox');
        const daysLeftText = document.getElementById('daysLeftText');
        const badgeContainer = document.getElementById('statusBadgeContainer');

        daysLeftText.innerHTML = `الأيام المتبقية على الانتهاء: <strong>${diffDays} يوم</strong>`;

        let badgeHtml = '';
        let resultText = '';
        let resultColor = '#166534';
        const productName = productType === 'popcorn' ? 'فشار' : 'منتج عادي';

        if (productType === 'popcorn') {
            if (diffDays === 6) {
                resultText = 'قبول ✅';
                resultColor = '#166534';
                badgeHtml = `<div class="status-badge status-accepted">${resultText}</div>`;
            } else if (diffDays < 6 && diffDays >= 0) {
                resultText = 'مرفوض (للفشار أقل من 6 أيام) ❌';
                resultColor = '#991b1b';
                badgeHtml = `<div class="status-badge status-rejected">${resultText}</div>`;
            } else if (diffDays > 18) {
                resultText = 'مرفوض (أكثر من 18 يوم) ❌';
                resultColor = '#991b1b';
                badgeHtml = `<div class="status-badge status-rejected">${resultText}</div>`;
            } else if (diffDays >= 10 && diffDays <= 18) {
                resultText = 'الفرع يرجعه سيستم (good)';
                resultColor = '#854d0e';
                badgeHtml = `<div class="status-badge status-warning">${resultText}</div>`;
            } else if (diffDays < 10 && diffDays > 6) {
                resultText = 'مرفوض (أقل من 10 أيام) ❌';
                resultColor = '#991b1b';
                badgeHtml = `<div class="status-badge status-rejected">${resultText}</div>`;
            } else {
                resultText = 'منتهي الصلاحية ❌';
                resultColor = '#991b1b';
                badgeHtml = `<div class="status-badge status-rejected">${resultText}</div>`;
            }
        } else {
            if (diffDays > 18) {
                resultText = 'مرفوض (أكثر من 18 يوم) ❌';
                resultColor = '#991b1b';
                badgeHtml = `<div class="status-badge status-rejected">${resultText}</div>`;
            } else if (diffDays >= 10 && diffDays <= 18) {
                resultText = 'الفرع يرجعه سيستم (good)';
                resultColor = '#854d0e';
                badgeHtml = `<div class="status-badge status-warning">${resultText}</div>`;
            } else if (diffDays >= 0 && diffDays < 10) {
                resultText = 'مرفوض (أقل من 10 أيام) ❌';
                resultColor = '#991b1b';
                badgeHtml = `<div class="status-badge status-rejected">${resultText}</div>`;
            } else {
                resultText = 'منتهي الصلاحية ❌';
                resultColor = '#991b1b';
                badgeHtml = `<div class="status-badge status-rejected">${resultText}</div>`;
            }
        }

        badgeContainer.innerHTML = badgeHtml;
        resultBox.classList.add('show');

        const now = new Date();
        const timeString = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
        
        returnLogs.push({
            hrId: currentHrId,
            product: productName,
            days: diffDays,
            result: resultText,
            color: resultColor,
            time: timeString
        });

        localStorage.setItem('returnLogs', JSON.stringify(returnLogs));
    }
</script>

</body>
</html>
